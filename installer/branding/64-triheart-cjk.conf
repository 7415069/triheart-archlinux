<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Keep localechooser's font selection unchanged. Use DejaVu for Latin
       text and cdebconf spacing markers, with Noto Sans for Chinese glyphs. -->
  <alias binding="strong">
    <family>AR PL ShanHeiSun Uni</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <!-- Current d-i falls back to DejaVu when the legacy AR PL family is
       absent. Put Noto immediately after DejaVu, ahead of Droid/Motoya. -->
  <alias binding="strong">
    <family>DejaVu Sans</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
